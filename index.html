<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .form-box {
            width: 300px;
            margin: 100px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        .password-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .eye {
            position: absolute;
            right: 10px;
            top: 20px;
            cursor: pointer;
            user-select: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h3>Login Form</h3>

    <form>
        <input type="text" placeholder="Username" required>

        <div class="password-box">
            <input type="password" id="password" placeholder="Password" required>
            <span class="eye" onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">Login</button>
    </form>
</div>

<script>
    function togglePassword() {
        let pass = document.getElementById("password");

        if (pass.type === "password") {
            pass.type = "text";
        } else {
            pass.type = "password";
        }
    }
</script>

</body>
</html>
